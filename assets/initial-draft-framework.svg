<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1780" viewBox="0 0 1280 1780">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .title { font: 700 42px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111; }
      .subtitle { font: 400 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #555; }
      .stage-label { font: 700 26px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111; }
      .chapter { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #777; }
      .core { font: 700 26px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111; }
      .node { font: 600 21px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #222; }
      .note { font: 400 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #555; }
      .small { font: 400 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #666; }
      .box { fill: #fff; stroke: #333; stroke-width: 2.2; rx: 12; }
      .dash { fill: none; stroke: #333; stroke-width: 2.4; stroke-dasharray: 12 9; rx: 14; }
      .node-box { fill: #f7f7f7; stroke: #444; stroke-width: 1.8; rx: 8; }
      .weak-box { fill: #f4f4f4; stroke: #777; stroke-width: 1.8; stroke-dasharray: 8 6; rx: 8; }
      .line { stroke: #444; stroke-width: 2; fill: none; }
      .arrow { fill: #111; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="1780"/>

  <text class="title" x="640" y="72" text-anchor="middle">初稿行文逻辑框架图</text>
  <text class="subtitle" x="640" y="108" text-anchor="middle">从后摩尔背景出发，依次说明材料优势、技术难点、应用前景与总结</text>

  <!-- Stage 1 -->
  <rect class="dash" x="70" y="245" width="1140" height="205"/>
  <text class="stage-label" x="110" y="292">提出问题</text>
  <text class="chapter" x="1090" y="292" text-anchor="middle">第一章</text>
  <rect class="box" x="420" y="268" width="440" height="48"/>
  <text class="core" x="640" y="301" text-anchor="middle">引言：后摩尔时代与二维半导体机遇</text>
  <line class="line" x1="640" y1="316" x2="640" y2="342"/>
  <line class="line" x1="260" y1="342" x2="1020" y2="342"/>
  <line class="line" x1="260" y1="342" x2="260" y2="358"/>
  <line class="line" x1="640" y1="342" x2="640" y2="358"/>
  <line class="line" x1="1020" y1="342" x2="1020" y2="358"/>
  <rect class="node-box" x="130" y="358" width="260" height="44"/>
  <text class="node" x="260" y="387" text-anchor="middle">硅基物理极限与功耗墙</text>
  <rect class="node-box" x="500" y="358" width="280" height="44"/>
  <text class="node" x="640" y="387" text-anchor="middle">从石墨烯到 TMDs</text>
  <rect class="node-box" x="890" y="358" width="260" height="44"/>
  <text class="node" x="1020" y="387" text-anchor="middle">核心战略意义与机遇</text>

  <polygon class="arrow" points="640,480 616,450 664,450"/>

  <!-- Stage 2 -->
  <rect class="dash" x="70" y="500" width="1140" height="270"/>
  <text class="stage-label" x="110" y="548">证明潜力</text>
  <text class="chapter" x="1090" y="548" text-anchor="middle">第二章</text>
  <rect class="box" x="410" y="522" width="460" height="48"/>
  <text class="core" x="640" y="555" text-anchor="middle">二维半导体的本征优势分析</text>
  <line class="line" x1="640" y1="570" x2="640" y2="596"/>
  <line class="line" x1="210" y1="596" x2="1070" y2="596"/>
  <line class="line" x1="210" y1="596" x2="210" y2="612"/>
  <line class="line" x1="500" y1="596" x2="500" y2="612"/>
  <line class="line" x1="780" y1="596" x2="780" y2="612"/>
  <line class="line" x1="1070" y1="596" x2="1070" y2="612"/>
  <rect class="node-box" x="95" y="612" width="230" height="50"/>
  <text class="node" x="210" y="643" text-anchor="middle">亚纳米厚度与强栅控</text>
  <rect class="node-box" x="375" y="612" width="250" height="50"/>
  <text class="node" x="500" y="643" text-anchor="middle">厚度依赖能带结构</text>
  <rect class="node-box" x="655" y="612" width="250" height="50"/>
  <text class="node" x="780" y="643" text-anchor="middle">输运特性与饱和速度</text>
  <rect class="node-box" x="955" y="612" width="230" height="50"/>
  <text class="node" x="1070" y="643" text-anchor="middle">界面稳定性与可靠性</text>

  <polygon class="arrow" points="640,800 616,770 664,770"/>

  <!-- Stage 3 -->
  <rect class="dash" x="70" y="820" width="1140" height="365"/>
  <text class="stage-label" x="110" y="868">列出现状</text>
  <text class="chapter" x="1090" y="868" text-anchor="middle">第三章</text>
  <rect class="box" x="435" y="842" width="410" height="48"/>
  <text class="core" x="640" y="875" text-anchor="middle">技术难点与现状</text>
  <line class="line" x1="640" y1="890" x2="640" y2="915"/>
  <line class="line" x1="180" y1="915" x2="1100" y2="915"/>
  <line class="line" x1="180" y1="915" x2="180" y2="932"/>
  <line class="line" x1="410" y1="915" x2="410" y2="932"/>
  <line class="line" x1="640" y1="915" x2="640" y2="932"/>
  <line class="line" x1="870" y1="915" x2="870" y2="932"/>
  <line class="line" x1="1100" y1="915" x2="1100" y2="932"/>
  <rect class="node-box" x="85" y="932" width="190" height="78"/>
  <text class="node" x="180" y="963" text-anchor="middle">接触电阻</text>
  <text class="node" x="180" y="992" text-anchor="middle">费米能级钉扎</text>
  <rect class="node-box" x="315" y="932" width="190" height="78"/>
  <text class="node" x="410" y="963" text-anchor="middle">原子级刻蚀</text>
  <text class="node" x="410" y="992" text-anchor="middle">加工损伤控制</text>
  <rect class="node-box" x="545" y="932" width="190" height="78"/>
  <text class="node" x="640" y="963" text-anchor="middle">栅叠层可靠性</text>
  <text class="node" x="640" y="992" text-anchor="middle">界面态工程</text>
  <rect class="node-box" x="775" y="932" width="190" height="78"/>
  <text class="node" x="870" y="963" text-anchor="middle">极性调控</text>
  <text class="node" x="870" y="992" text-anchor="middle">PMOS 缺失</text>
  <rect class="node-box" x="1005" y="932" width="190" height="78"/>
  <text class="node" x="1100" y="963" text-anchor="middle">晶圆级集成</text>
  <text class="node" x="1100" y="992" text-anchor="middle">M3D 架构</text>

  <polygon class="arrow" points="640,1215 616,1185 664,1185"/>

  <!-- Stage 4 -->
  <rect class="dash" x="70" y="1235" width="1140" height="185"/>
  <text class="stage-label" x="110" y="1283">展开不足</text>
  <text class="chapter" x="1090" y="1283" text-anchor="middle">第四章</text>
  <rect class="box" x="500" y="1257" width="280" height="48"/>
  <text class="core" x="640" y="1290" text-anchor="middle">应用前景</text>
  <line class="line" x1="640" y1="1305" x2="640" y2="1332"/>
  <rect class="weak-box" x="185" y="1332" width="250" height="46"/>
  <text class="node" x="310" y="1362" text-anchor="middle">先进逻辑</text>
  <rect class="weak-box" x="515" y="1332" width="250" height="46"/>
  <text class="node" x="640" y="1362" text-anchor="middle">单片三维</text>
  <rect class="weak-box" x="845" y="1332" width="250" height="46"/>
  <text class="node" x="970" y="1362" text-anchor="middle">柔性 / 传感应用</text>

  <polygon class="arrow" points="640,1450 616,1420 664,1420"/>

  <!-- Stage 5 -->
  <rect class="dash" x="70" y="1470" width="1140" height="185"/>
  <text class="stage-label" x="110" y="1518">收束全文</text>
  <text class="chapter" x="1090" y="1518" text-anchor="middle">第五章</text>
  <rect class="box" x="500" y="1492" width="280" height="48"/>
  <text class="core" x="640" y="1525" text-anchor="middle">总结与展望</text>
  <line class="line" x1="640" y1="1540" x2="640" y2="1567"/>
  <rect class="weak-box" x="230" y="1567" width="280" height="46"/>
  <text class="node" x="370" y="1597" text-anchor="middle">概括二维材料潜力</text>
  <rect class="weak-box" x="770" y="1567" width="280" height="46"/>
  <text class="node" x="910" y="1597" text-anchor="middle">展望后摩尔应用</text>
</svg>
