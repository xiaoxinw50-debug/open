name: Scheduled paper ingestion

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-paper-ingestion
  cancel-in-progress: false

jobs:
  trigger-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render ingestion endpoint
        env:
          SITE_URL: https://switch-margin-site.onrender.com
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          set -euo pipefail

          header_args=()
          if [ -n "${INGEST_TOKEN}" ]; then
            header_args=(-H "x-ingest-token: ${INGEST_TOKEN}")
          fi

          curl --fail --show-error --silent --max-time 240 \
            -X POST "${SITE_URL}/api/ingest/run" \
            -H "content-type: application/json" \
            "${header_args[@]}" \
            --data "{}"
