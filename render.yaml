services:
  - type: web
    name: switch-margin-site
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AUTO_INGEST_ENABLED
        value: "true"
      - key: AUTO_INGEST_ON_START
        value: "true"
      - key: INGEST_INTERVAL_HOURS
        value: "6"
      - key: INGEST_LOOKBACK_DAYS
        value: "180"
      - key: INGEST_MAX_PER_QUERY
        value: "30"
      - key: FULLTEXT_ENABLED
        value: "true"
      - key: FULLTEXT_MAX_PER_RUN
        value: "18"
      - key: FULLTEXT_TIMEOUT_MS
        value: "9000"
