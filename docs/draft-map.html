<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>初稿思维导图 | 后摩尔时代二维半导体电子技术</title>
    <link rel="stylesheet" href="./styles.css?v=20260627-draft-clean2" />
  </head>
  <body>
    <header class="site-hero">
      <nav class="topbar" aria-label="页面导航">
        <div class="brand">
          <span class="brand-mark">2D</span>
          <div>
            <strong>初稿思维导图</strong>
            <small>original draft logic map</small>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="plain-link" href="./map.html?v=20260627-draft-clean2">查看当前思维导图</a>
          <a class="plain-link" href="./index.html?v=20260627-draft-clean2">返回论文正文</a>
          <a class="plain-link" href="./assets/initial-draft-framework.svg?v=20260627-draft-clean2" target="_blank" rel="noreferrer">打开原图</a>
        </div>
      </nav>
    </header>

    <main class="map-shell">
      <section class="map-page">
        <section class="map-panel draft-map-panel">
          <div class="panel-title">
            <span>初稿行文框架</span>
            <small>交付图本体，不混入说明文字</small>
          </div>
          <figure class="draft-map-figure">
            <img src="./assets/initial-draft-framework.svg?v=20260627-draft-clean2" alt="初稿论文思维导图：从提出问题、建立基础、分析问题到总结展望的早期行文框架" />
          </figure>
        </section>

        <section class="map-panel draft-note-panel">
          <div class="panel-title">
            <span>对照说明</span>
            <small>以下文字是页面说明，不属于交付图本体</small>
          </div>
          <div class="draft-note-grid">
            <article>
              <strong>初稿特点</strong>
              <p>初稿更接近资料综述式框架，重点是按背景、材料、器件、应用和挑战依次展开，结构完整，但中心问题还不够集中。</p>
            </article>
            <article>
              <strong>当前改进</strong>
              <p>当前版本把主线收束到“本征优势能否在接触、介质、工艺、统计和系统验证中保留下来”，论证方向更明确。</p>
            </article>
            <article>
              <strong>保留价值</strong>
              <p>初稿图适合回看论文最早的章节组织，也可以作为答辩时说明论文如何从宽泛综述逐步收束为明确论点的材料。</p>
            </article>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
