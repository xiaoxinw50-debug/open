<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>论文交互可视化 | 后摩尔时代二维半导体电子技术</title>
    <link rel="stylesheet" href="./styles.css?v=20260627-mindmap-optimized" />
  </head>
  <body>
    <header class="site-hero">
      <nav class="topbar" aria-label="页面导航">
        <div class="brand">
          <span class="brand-mark">2D</span>
          <div>
            <strong>论文阅读</strong>
            <small>正文 / 目录 / 参考文献</small>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="plain-link" href="./map.html?v=20260627-mindmap-optimized">查看思维导图</a>
          <a class="plain-link" href="./draft-map.html?v=20260627-mindmap-optimized">初稿思维导图</a>
          <button class="ghost-button" id="toggle-edit" type="button">编辑论文</button>
          <button class="ghost-button" id="export-edits" type="button">导出修改</button>
          <button class="ghost-button" id="import-edits" type="button">导入修改</button>
          <input id="import-edits-file" type="file" accept="application/json,.json" hidden />
          <button class="ghost-button danger-button" id="clear-edits" type="button">恢复原文</button>
          <button class="ghost-button" id="toggle-length" type="button">折叠长文</button>
          <button class="ghost-button" id="reset-view" type="button">重置视图</button>
        </div>
      </nav>

      <section class="paper-intro">
        <div>
          <p class="eyebrow">论文交互阅读版</p>
          <h1 id="paper-title">后摩尔时代的二维半导体电子技术</h1>
          <p class="lead">
            下面直接展示论文正文。点击任意段落或文献编号，即可在右侧查看对应参考文献。
          </p>
        </div>
        <div class="hero-tools">
          <label class="search-box">
            <span>全文检索</span>
            <input id="search-input" type="search" placeholder="例如：接触电阻、栅介质、WSe₂、单片三维" />
          </label>
          <label class="search-box compact">
            <span>段落类型</span>
            <select id="type-filter">
              <option value="all">全部</option>
              <option value="background">背景</option>
              <option value="analysis">分析</option>
              <option value="evidence">证据</option>
              <option value="synthesis">归纳</option>
              <option value="figure-table">图题/表题</option>
              <option value="image">图片</option>
              <option value="table">表格</option>
            </select>
          </label>
        </div>
        <div class="paper-meta-line" aria-label="论文统计">
          <span><b id="metric-paragraphs">--</b> 个段落</span>
          <span><b id="metric-references">--</b> 条参考文献</span>
          <span><b id="metric-cited">--</b> 条正文直接引用</span>
          <span id="edit-status" class="edit-status">只读模式</span>
          <span id="source-file" class="source-note"></span>
        </div>
      </section>
    </header>

    <main class="app-shell paper-shell">
      <aside class="left-rail">
        <section class="panel">
          <div class="panel-title">
            <span>目录</span>
            <small>点击筛选章节</small>
          </div>
          <div id="toc-list" class="toc-list"></div>
        </section>
      </aside>

      <section class="content-stack">
        <section class="panel reading-panel">
          <div class="panel-title sticky-title">
            <span>正文段落</span>
            <small id="paragraph-count-label">点击段落查看参考文献</small>
          </div>
          <div id="paragraph-list" class="paragraph-list"></div>
        </section>
      </section>

      <aside class="right-rail">
        <section class="panel reference-panel">
          <div class="panel-title">
            <span>段落引用</span>
            <small id="active-paragraph-label">尚未选择段落</small>
          </div>
          <div id="reference-detail" class="reference-detail empty">
            点击正文任意段落，这里会显示该段涉及的参考文献、DOI 和被引用位置。
          </div>
        </section>

        <section class="panel bibliography-panel">
          <div class="panel-title">
            <span>参考文献库</span>
            <small>点击反查正文段落</small>
          </div>
          <label class="mini-search">
            <input id="reference-search" type="search" placeholder="搜索作者、期刊、DOI 或编号" />
          </label>
          <div id="bibliography-list" class="bibliography-list"></div>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <span>Generated from DOCX. Update data with <code>python3 scripts/build_paper_data.py</code>.</span>
    </footer>

    <script src="./data/paper-data.js?v=20260627-mindmap-optimized"></script>
    <script src="./app.js?v=20260627-mindmap-optimized"></script>
  </body>
</html>
